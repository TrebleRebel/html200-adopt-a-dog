            <h1>Checkout</h1>
                <form>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name"><br>
                    <label for="email">Email Address:</label><br>
                    <input type="text" id="email" name="email"><br>
                    <label for="street">Street Address:</label><br>
                    <input type="text" id="street" name="street"><br>
                    <label for="city">City:</label><br>
                    <input type="text" id="city" name="city"><br>
                    <label for="state">State:</label><br>
                    <select name="state" id="state"><br>

                        <option value="ID">ID</option>
                        <option value="OR">OR</option>
                    </select><br>
                    <label for="zip">Zip Code:</label><br>
                    <input type="text" id="zip" name="zip"><br>
                    <label for="first-time">First Time Adopter?</label><br>
                    <input type="radio" id="yes" name="first-time" value="yes">
                    <label for="age1">Yes</label><br>
                    <input type="radio" id="no" name="first-time" value="no">
                    <label for="age2">No</label><br> 
                    <label for="state">Pickup Location:</label><br>
                    <select name="pickup" id="pickup"><br>
                        <option value="Seattle">Seattle</option>
                        <option value="Tacoma">Tacoma</option>
                        <option value="Everett">Everett</option>
                        <option value="Olympia">Olympia</option>
                    </select><br>
                    <label for="name">Dogs Adopted</label><br>
                    <label for="name">Total Adoption Cost</label><br>

                    <input type="submit" value="Submit">
                </form>
